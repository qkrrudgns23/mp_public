<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout Grid — 3D viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0f; color: #e2e8f0; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 10px; left: 10px; z-index: 10; font-size: 12px; line-height: 1.45; max-width: 420px; pointer-events: none; opacity: 0.92; }
    #err { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 300; color: #f87171; padding: 16px; max-width: 90%; text-align: center; }
    #loading-overlay {
      position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
      background: #0d0d0f; flex-direction: column; gap: 20px; transition: opacity 0.35s ease;
    }
    #loading-overlay.is-hiding { opacity: 0; pointer-events: none; }
    #loading-overlay .loading-inner { text-align: center; max-width: 340px; padding: 24px; }
    #loading-overlay .loading-spinner {
      width: 44px; height: 44px; margin: 0 auto 8px; border: 3px solid rgba(148, 163, 184, 0.25);
      border-top-color: #7c6af7; border-radius: 50%; animation: grid3d-spin 0.85s linear infinite;
    }
    @keyframes grid3d-spin { to { transform: rotate(360deg); } }
    #loading-overlay .loading-title { font-size: 17px; font-weight: 600; margin: 0 0 8px; color: #f1f5f9; }
    #loading-overlay .loading-sub { font-size: 13px; line-height: 1.5; margin: 0; color: #94a3b8; }
    #veh-spawn-fab {
      position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 60;
      width: 44px; height: 44px; border-radius: 12px; padding: 0; margin: 0;
      border: 1px solid rgba(124, 106, 247, 0.5); background: rgba(15, 23, 42, 0.94); color: #e2e8f0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    #veh-spawn-fab:hover { border-color: #7c6af7; background: rgba(30, 41, 59, 0.96); transform: translateY(-50%) scale(1.04); }
    #veh-spawn-fab:active { transform: translateY(-50%) scale(0.98); }
    #veh-spawn-fab.veh-fab-driving { border-color: rgba(52, 211, 153, 0.65); }
    #veh-spawn-fab svg { width: 22px; height: 22px; display: block; }
    #veh-spawn-fab .veh-ico-stroke { fill: none; stroke: #e2e8f0; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    #vehicle-hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 55; max-width: min(520px, 92vw);
      padding: 10px 16px; border-radius: 10px; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1; font-size: 12px; line-height: 1.45; text-align: center; pointer-events: none;
    }
    #vehicle-hint[hidden] { display: none !important; }
    #vehicle-hint.vehicle-hint-err { color: #fecaca; border-color: rgba(248, 113, 113, 0.45); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
</head>
<body>
  <div id="loading-overlay" aria-busy="true" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-spinner" role="presentation"></div>
      <p class="loading-title" id="loading-title">레이아웃을 불러오는 중</p>
      <p class="loading-sub" id="loading-sub">디자이너에서 데이터가 전달되면 3D 장면이 표시됩니다.</p>
    </div>
  </div>
  <div id="hud">Layout 3D — <strong>Z = elevation</strong> · ground = scene XY. Drag orbit · wheel zoom · right-drag pan</div>
  <div id="err" style="display:none;"></div>
  <button type="button" id="veh-spawn-fab" aria-label="구체 추적 시점" title="구체 추적 (다시 누르면 궤도)">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle class="veh-ico-stroke" cx="12" cy="12" r="7.5" />
    </svg>
  </button>
  <div id="vehicle-hint" hidden>마우스: 시점 · 휠: 거리 · ↑↓: 전후진 · ←→: 조향 · W: 고도 상승 · S: 고도 하강 · Esc 궤도</div>
  <script>
(function () {
  var grid3dPayloadWatchdog = null;
  function setLoadingText(title, sub) {
    var t = document.getElementById('loading-title');
    var s = document.getElementById('loading-sub');
    if (t && title) t.textContent = title;
    if (s && sub) s.textContent = sub;
  }
  function hideLoadingOverlay() {
    var el = document.getElementById('loading-overlay');
    if (!el || el.getAttribute('data-hidden') === '1') return;
    el.setAttribute('data-hidden', '1');
    el.classList.add('is-hiding');
    el.setAttribute('aria-busy', 'false');
    window.setTimeout(function () {
      el.style.display = 'none';
    }, 380);
  }
  function scheduleHideLoadingAfterPaint() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        hideLoadingOverlay();
      });
    });
  }
  function showErr(msg) {
    var ov = document.getElementById('loading-overlay');
    if (ov) {
      ov.style.display = 'none';
      ov.classList.remove('is-hiding');
      ov.setAttribute('data-hidden', '1');
      ov.setAttribute('aria-busy', 'false');
    }
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = msg;
  }
  function runViewer(payload) {
    if (!payload || !payload.layout) {
      showErr('Invalid layout payload.');
      return;
    }
    setLoadingText('3D 장면을 구성하는 중', '모델과 조명을 준비하고 있습니다…');
    var errBanner = document.getElementById('err');
    if (errBanner) {
      errBanner.style.display = 'none';
      errBanner.textContent = '';
    }
    window.__GRID3D_STARTED__ = true;

  var L = payload.layout;
  var g = L.grid || {};
  var cs = Number(g.cellSize) > 0 ? Number(g.cellSize) : 25;
  var cols = Number(g.cols) > 0 ? Math.floor(g.cols) : 80;
  var rows = Number(g.rows) > 0 ? Math.floor(g.rows) : 80;
  var maxX = cols * cs;
  var maxY = rows * cs;
  var cfg = payload.viewerConfig || {};
  var majorEvery = Number(cfg.gridMajorInterval) > 0 ? Math.floor(cfg.gridMajorInterval) : 5;
  var bgHex = (cfg.gridViewBg && String(cfg.gridViewBg)) || '#0d0d0f';
  var showGrid = g.showGrid !== false;
  var showImage = g.showImage !== false;
  var showRoadWidth3d = g.showRoadWidth !== false;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(bgHex);

  var centerX = maxX * 0.5;
  var centerY = maxY * 0.5;
  var maxDim = Math.max(maxX, maxY);
  var camNear = Math.max(0.5, Math.min(80, maxDim / 12000));
  var camFar = Math.min(1e7, maxDim * 80);
  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, camNear, camFar);
  camera.up.set(0, 0, 1);
  camera.position.set(centerX + maxDim * 0.9, centerY + maxDim * 0.9, maxDim * 0.75);
  camera.lookAt(centerX, centerY, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  renderer.physicallyCorrectLights = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.045;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(centerX, centerY, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.zoomSpeed = 4;
  controls.update();

  var clock = new THREE.Clock();
  var vehicleMode = 'orbit';
  var vehicleRoot = null;
  var vehicleYaw = 0;
  var vehicleMeshYaw = 0;
  var meshYawSmooth = 10;
  var keysDown = Object.create(null);
  var orbitViewFov = 50;
  var chaseViewFov = 58;
  var chaseCamDistance = 36;
  var chaseCamPitch = 0.34;
  var chaseCamOrbitYaw = 0;
  var chasePitchMin = 0.14;
  var chasePitchMax = 1.12;
  var chaseDistMin = 14;
  var chaseDistMax = 72;
  var moveSpeed = 52;
  var steerSpeed = 2.35;
  var wKeyClimbZ = 22;
  var sKeyDescendZ = 22;
  var vehicleVelFwd = 0;
  var vehicleYawRate = 0;
  var driveResponse = 9;
  var steerResponse = 11;
  var vehHint = document.getElementById('vehicle-hint');
  function showVehicleHint() {
    if (vehHint) {
      vehHint.hidden = false;
      vehHint.classList.remove('vehicle-hint-err');
    }
  }
  function hideVehicleHint() {
    if (vehHint) vehHint.hidden = true;
  }
  function disposeMaterial(m) {
    if (!m) return;
    if (m.map) m.map.dispose();
    if (m.lightMap) m.lightMap.dispose();
    if (m.bumpMap) m.bumpMap.dispose();
    if (m.normalMap) m.normalMap.dispose();
    if (m.specularMap) m.specularMap.dispose();
    if (m.envMap) m.envMap.dispose();
    if (m.aoMap) m.aoMap.dispose();
    if (m.emissiveMap) m.emissiveMap.dispose();
    if (m.metalnessMap) m.metalnessMap.dispose();
    if (m.roughnessMap) m.roughnessMap.dispose();
    m.dispose();
  }
  function clearVehicleMesh() {
    if (!vehicleRoot) return;
    scene.remove(vehicleRoot);
    vehicleRoot.traverse(function (obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(disposeMaterial);
        else disposeMaterial(obj.material);
      }
    });
    vehicleRoot = null;
  }
  function syncVehicleFabUi() {
    var fab = document.getElementById('veh-spawn-fab');
    if (!fab) return;
    if (vehicleMode !== 'orbit' && vehicleRoot) fab.classList.add('veh-fab-driving');
    else fab.classList.remove('veh-fab-driving');
  }
  function setOrbitCameraMode() {
    vehicleMode = 'orbit';
    vehicleVelFwd = 0;
    vehicleYawRate = 0;
    vehicleMeshYaw = vehicleYaw;
    controls.enabled = true;
    camera.fov = orbitViewFov;
    camera.updateProjectionMatrix();
    hideVehicleHint();
    try {
      document.exitPointerLock();
    } catch (eL) { /* ignore */ }
    if (vehicleRoot) {
      controls.target.copy(vehicleRoot.position);
    } else {
      controls.target.set(centerX, centerY, 0);
    }
    controls.update();
    syncVehicleFabUi();
  }
  function placeVehicleOnGround(root) {
    root.updateMatrixWorld(true);
    var box = new THREE.Box3().setFromObject(root);
    var size = box.getSize(new THREE.Vector3());
    var maxD = Math.max(size.x, size.y, size.z);
    var targetLen = 4;
    if (maxD > 1e-6) root.scale.multiplyScalar(targetLen / maxD);
    root.updateMatrixWorld(true);
    box.setFromObject(root);
    var groundZ = groundSurfaceZ + zLift - box.min.z;
    root.position.set(centerX, centerY, groundZ);
  }
  function spawnVehicleOrb() {
    clearVehicleMesh();
    var geo = new THREE.SphereGeometry(1, 28, 22);
    var mat = new THREE.MeshStandardMaterial({
      color: 0x8b7aff,
      metalness: 0.48,
      roughness: 0.28,
      envMapIntensity: 1.25,
    });
    if (scene.environment) {
      mat.envMap = scene.environment;
    }
    var mesh = new THREE.Mesh(geo, mat);
    mesh.name = 'vehicleOrb';
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    var pivot = new THREE.Group();
    pivot.add(mesh);
    placeVehicleOnGround(pivot);
    scene.add(pivot);
    vehicleRoot = pivot;
    vehicleYaw = 0;
    vehicleMeshYaw = 0;
    vehicleVelFwd = 0;
    vehicleYawRate = 0;
    chaseCamDistance = 36;
    chaseCamPitch = 0.34;
    chaseCamOrbitYaw = 0;
    vehicleMode = 'car';
    controls.enabled = false;
    camera.fov = chaseViewFov;
    camera.updateProjectionMatrix();
    pivot.rotation.set(0, 0, vehicleMeshYaw);
    updateChaseCamera();
    showVehicleHint();
    syncVehicleFabUi();
    try {
      renderer.domElement.requestPointerLock();
    } catch (ePl) { /* ignore */ }
  }
  function updateChaseCamera() {
    if (!vehicleRoot) return;
    var px = vehicleRoot.position.x;
    var py = vehicleRoot.position.y;
    var pz = vehicleRoot.position.z;
    var lookZ = pz + 1.55;
    var horiz = Math.cos(chaseCamPitch) * chaseCamDistance;
    var dz = Math.sin(chaseCamPitch) * chaseCamDistance;
    var ang = vehicleYaw + Math.PI + chaseCamOrbitYaw;
    camera.position.set(
      px + Math.cos(ang) * horiz,
      py + Math.sin(ang) * horiz,
      lookZ + dz
    );
    camera.up.set(0, 0, 1);
    camera.lookAt(px, py, lookZ);
  }
  document.addEventListener('keydown', function (ev) {
    keysDown[ev.code] = true;
    if (ev.code === 'Escape' && vehicleMode !== 'orbit') {
      setOrbitCameraMode();
    }
  });
  document.addEventListener('keyup', function (ev) {
    keysDown[ev.code] = false;
  });
  document.addEventListener('mousemove', function (ev) {
    if (!vehicleRoot || vehicleMode === 'orbit') return;
    if (document.pointerLockElement !== renderer.domElement) return;
    if (typeof ev.movementX !== 'number') return;
    chaseCamOrbitYaw -= ev.movementX * 0.0046;
    chaseCamPitch += ev.movementY * 0.0034;
    chaseCamPitch = Math.max(chasePitchMin, Math.min(chasePitchMax, chaseCamPitch));
  });
  renderer.domElement.addEventListener(
    'wheel',
    function (ev) {
      if (vehicleMode === 'orbit' || !vehicleRoot) return;
      ev.preventDefault();
      chaseCamDistance += ev.deltaY * 0.055;
      chaseCamDistance = Math.max(chaseDistMin, Math.min(chaseDistMax, chaseCamDistance));
    },
    { passive: false }
  );
  var vehFab = document.getElementById('veh-spawn-fab');
  if (vehFab) {
    vehFab.addEventListener('click', function () {
      if (vehicleMode === 'orbit' || !vehicleRoot) spawnVehicleOrb();
      else setOrbitCameraMode();
    });
  }
  renderer.domElement.addEventListener('click', function () {
    if (vehicleMode !== 'orbit' && document.pointerLockElement !== renderer.domElement) {
      try {
        renderer.domElement.requestPointerLock();
      } catch (eClk) { /* ignore */ }
    }
  });

  var ambientLight = new THREE.AmbientLight(0xf4ebe3, 0.34);
  scene.add(ambientLight);
  var hemiLight = new THREE.HemisphereLight(0xf0dcc8, 0x8a7a72, 0.24);
  hemiLight.rotation.x = -Math.PI * 0.5;
  scene.add(hemiLight);
  var sun = new THREE.DirectionalLight(0xffecd8, 0.52);
  sun.position.set(maxDim * 0.5, maxDim * 0.28, maxDim * 1.55);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.00012;
  sun.shadow.normalBias = 0.018;
  sun.shadow.radius = 3;
  var sh = maxDim * 0.65;
  sun.shadow.camera.left = -sh;
  sun.shadow.camera.right = sh;
  sun.shadow.camera.top = sh;
  sun.shadow.camera.bottom = -sh;
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = maxDim * 8;
  sun.shadow.camera.updateProjectionMatrix();
  sun.target.position.set(centerX, centerY, 0);
  scene.add(sun.target);
  scene.add(sun);

  var zGround = 0;
  var zLift = 0.08;
  var building3dHeightM = 25;
  var groundSurfaceZ = zGround;
  var gTiles = payload.layoutGroundTiles;
  var useTiles = !!(gTiles && gTiles.tiles && gTiles.tiles.length === 4);
  var gt = payload.layoutGroundTexture;
  var groundTexUrl = '';
  if (!useTiles && gt && gt.dataUrl && String(gt.dataUrl).indexOf('data:') === 0) {
    groundTexUrl = gt.dataUrl;
  }
  var useGroundTex = useTiles || !!groundTexUrl;
  if (useGroundTex) {
    var maxWHForSlab = Math.max(maxX, maxY);
    var visZMulSlab = Math.max(1, Math.min(24, maxWHForSlab / 500));
    var worldThickMForSlab = 0.5;
    groundSurfaceZ = zGround + worldThickMForSlab * visZMulSlab;
  }

  /**
   * === Coordinate frame (must match pages/Layout_Design designer 2D world) ===
   * Designer: cellToPixel(col,row) -> [ col*CELL_SIZE, row*CELL_SIZE ].
   * Layout "x" = east along columns, "y" = south along rows (same as canvas +Y downward on screen).
   * Scene: Z-up; ground lies on plane z = zGround. Horizontal position is (sceneX, sceneY, z).
   * Mapping (orthographic top-down view aligned with 2D):
   *   sceneX = layoutX
   *   sceneY = maxLayoutY - layoutY
   * Vertical extrusion / aircraft altitude uses +Z only.
   * Heading: layout velocity (dx,dy) -> atan2(-dy, dx) for rotation about +Z in scene (Y is mirrored).
   */
  function layoutYToSceneGroundY(layoutY) {
    return maxY - (Number(layoutY) || 0);
  }

  function layoutPointToSceneGround(layoutX, layoutY, zElev) {
    var ze = zElev != null ? zElev : zGround;
    return new THREE.Vector3(Number(layoutX) || 0, layoutYToSceneGroundY(layoutY), ze);
  }

  function layoutHeadingRadFromVelocity(dx, dy) {
    return Math.atan2(-(Number(dy) || 0), Number(dx) || 0);
  }

  function vecXY(x, y, z) {
    return layoutPointToSceneGround(x, y, z);
  }

  function layoutShapeY(layoutY) {
    return layoutYToSceneGroundY(layoutY);
  }

  if (!useGroundTex) {
    var recvCol = new THREE.Color(bgHex);
    recvCol.multiplyScalar(0.9);
    var groundShadowRecv = new THREE.Mesh(
      new THREE.PlaneGeometry(maxX * 1.08, maxY * 1.08),
      new THREE.MeshLambertMaterial({ color: recvCol, side: THREE.DoubleSide })
    );
    groundShadowRecv.position.set(centerX, centerY, zGround - 0.12);
    groundShadowRecv.receiveShadow = true;
    groundShadowRecv.castShadow = false;
    groundShadowRecv.renderOrder = -12;
    scene.add(groundShadowRecv);
  }

  function addSegmentsLinesOnly(points, color, opacity) {
    if (!points || points.length < 2) return;
    var geo = new THREE.BufferGeometry().setFromPoints(points);
    var mat = new THREE.LineBasicMaterial({
      color: color,
      transparent: opacity < 1,
      opacity: opacity,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1
    });
    var line = new THREE.LineSegments(geo, mat);
    line.renderOrder = 3;
    scene.add(line);
  }

  function addSegments(points, color, opacity, ribbonWidthM) {
    if (!points || points.length < 2) return;
    if (points.length > 1200) {
      addSegmentsLinesOnly(points, color, opacity);
      return;
    }
    var rw = ribbonWidthM != null && isFinite(Number(ribbonWidthM)) ? Math.max(0.12, Number(ribbonWidthM)) : Math.max(0.45, cs * 0.04);
    var mat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: opacity < 1,
      opacity: opacity,
      depthTest: true,
      depthWrite: false,
      toneMapped: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
      side: THREE.DoubleSide
    });
    var zBias = 0.14;
    for (var si = 0; si < points.length - 1; si += 2) {
      var pa = points[si], pb = points[si + 1];
      if (!pa || !pb) continue;
      var dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var geom = new THREE.BoxGeometry(len, rw, 0.55);
      var mesh = new THREE.Mesh(geom, mat);
      mesh.renderOrder = 4;
      mesh.position.set((pa.x + pb.x) * 0.5, (pa.y + pb.y) * 0.5, (pa.z + pb.z) * 0.5 + zBias);
      mesh.rotation.z = Math.atan2(dy, dx);
      scene.add(mesh);
    }
  }

  function addSegmentsYellowBlackOutline(points, opacity, ribbonWidthM) {
    if (!points || points.length < 2) return;
    var rw = ribbonWidthM != null && isFinite(Number(ribbonWidthM)) ? Math.max(0.12, Number(ribbonWidthM)) : Math.max(0.45, cs * 0.04);
    var kOutline = Math.max(0.12, cs * 0.006);
    addSegments(points, paletteCenterlineUnderlayGray, Math.min(0.99, opacity + 0.04), rw + kOutline);
    addSegments(points, paletteApronTaxiwayYellow, opacity, rw);
  }

  var paletteTaxiwayConcrete = 0xa59f93;
  var paletteApronTaxiwayYellow = 0xffc800;
  /** Taxiway centerline ribbon only; under yellow band (island outline keeps paletteCenterlineUnderlayGray). */
  var paletteTaxiwayCenterlineUnderlayGray = 0x0a0a0a;
  var paletteCenterlineUnderlayGray = 0x3a3a3a;
  var paletteRunwayPaved = 0x7b796d;
  /** Matches designer 2D taxiway width stroke (Information.json canvas2d.runwayStroke). */
  var paletteRunwayStroke = 0x6d6a61;
  function paletteRgbLightenSteps(hex24, steps) {
    var f = Math.pow(1 / 0.88, steps);
    var r = (hex24 >> 16) & 255, g = (hex24 >> 8) & 255, b = hex24 & 255;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return (r << 16) | (g << 8) | b;
  }
  function paletteRgbChannelScale(hex24, mul) {
    var f = Number(mul);
    if (!isFinite(f)) return hex24;
    var r = (hex24 >> 16) & 255, g = (hex24 >> 8) & 255, b = hex24 & 255;
    r = Math.max(0, Math.min(255, Math.round(r * f)));
    g = Math.max(0, Math.min(255, Math.round(g * f)));
    b = Math.max(0, Math.min(255, Math.round(b * f)));
    return (r << 16) | (g << 8) | b;
  }
  /** Marker area fill: three lighten steps vs runway stroke (designer 2D). */
  var paletteMarkerAreaFill = paletteRgbLightenSteps(paletteRunwayStroke, 3);
  /** Taxiway width band: one step darker than marker area (two lighten steps). */
  var paletteTaxiwayPavedWidth = paletteRgbLightenSteps(paletteRunwayStroke, 2);
  /** Runway path & runway taxiway width band: dark asphalt gray (designer 2D #363636). */
  var paletteRunwayAsphaltPavedWidth = 0x363636;

            color: markerIslandInnerRingColor,
            toneMapped: false,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1,
            side: THREE.DoubleSide
          });
          var meshRing = new THREE.Mesh(geoRing, matRing);
          meshRing.position.z = zLift + 0.18;
          meshRing.renderOrder = 2;
          scene.add(meshRing);
          var shIn = new THREE.Shape();
          shIn.moveTo(innerL[0][0], layoutShapeY(innerL[0][1]));
          for (var ik = 1; ik < innerL.length; ik++) shIn.lineTo(innerL[ik][0], layoutShapeY(innerL[ik][1]));
          shIn.closePath();
          var depIn = 0.14;
          var geoIn = new THREE.ExtrudeGeometry(shIn, { depth: depIn, bevelEnabled: false });
          var matIn = new THREE.MeshBasicMaterial({
            color: markerIslandGrassColor,
            toneMapped: false,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1,
            side: THREE.DoubleSide
          });
          var meshIn = new THREE.Mesh(geoIn, matIn);
          meshIn.position.z = zLift + 0.24;
          meshIn.renderOrder = 3;
          scene.add(meshIn);
        }
      }
      var segsI = [];
      for (var pi = 0; pi < m.points.length; pi++) {
        var p0 = m.points[pi], p1 = m.points[(pi + 1) % m.points.length];
        if (!p0 || !p1) continue;
        segsI.push(vecXY(p0.x, p0.y, zLift + 0.35), vecXY(p1.x, p1.y, zLift + 0.35));
      }
      if (segsI.length) addSegmentsYellowBlackOutline(segsI, 0.95, Math.max(0.48, cs * 0.042));
      if (ptsW.length >= 3) {
        var zIslN = zLift + 0.42;
        var distAlongN = 0;
        for (var eidx = 0; eidx < ptsW.length; eidx++) {
          var e0 = ptsW[eidx], e1 = ptsW[(eidx + 1) % ptsW.length];
          var edx = e1[0] - e0[0], edy = e1[1] - e0[1];
          var edgeLen = Math.sqrt(edx * edx + edy * edy);
          if (edgeLen < 1e-6) continue;
          var nn = islandInwardNormal3d(e0, e1, cix, ciy);
          var ux = edx / edgeLen, uy = edy / edgeLen;
          var firstS = Math.ceil(distAlongN / islandNormalStepM) * islandNormalStepM;
          for (var sp = firstS; sp < distAlongN + edgeLen - 1e-6; sp += islandNormalStepM) {
            var tLoc = sp - distAlongN;
            if (tLoc < -1e-6) continue;
            var px = e0[0] + ux * tLoc, py = e0[1] + uy * tLoc;
            var q0 = vecXY(px, py, zIslN);
            var q1 = vecXY(px + nn[0] * islandNormalLenM, py + nn[1] * islandNormalLenM, zIslN);
            addSegmentsYellowBlackOutline([q0, q1], 0.96, Math.max(0.22, cs * 0.018));
          }
          distAlongN += edgeLen;
        }
      }
    }
  });
  }

  if (typeof THREE.RGBELoader !== 'undefined' && typeof THREE.PMREMGenerator !== 'undefined') {
    var pmremHdr = new THREE.PMREMGenerator(renderer);
    pmremHdr.compileEquirectangularShader();
    var hdrUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/qwantani_puresky_1k.hdr';
    new THREE.RGBELoader().setDataType(THREE.FloatType).load(
      hdrUrl,
      function (hdrTexture) {
        hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
        hdrTexture.encoding = THREE.LinearEncoding;
        var pmremRt = pmremHdr.fromEquirectangular(hdrTexture);
        scene.environment = pmremRt.texture;
        scene.background = new THREE.Color(bgHex);
        scene.traverse(function (o) {
          if (!o.isMesh || !o.material) return;
          var m = o.material;
          if (m.isMeshStandardMaterial) {
            m.envMap = pmremRt.texture;
            if (o.userData && o.userData.roadWidthPavement3d) {
              var eiW = m.envMapIntensity != null ? m.envMapIntensity : 0.88;
              m.envMapIntensity = Math.min(1.22, eiW * 1.1);
            }
            m.needsUpdate = true;
          }
        });
        ambientLight.color.setHex(0xf3e8dc);
        ambientLight.intensity = 0.26;
        hemiLight.color.setHex(0xffe8d4);
        hemiLight.groundColor.setHex(0x7d726e);
        hemiLight.intensity = 0.22;
      },
      undefined,
      function (err) {
        console.error('grid3d HDRI load failed', err);
      }
    );
  }

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.08);
    if (vehicleMode === 'orbit') {
      controls.update();
    } else if (vehicleRoot) {
      var fwd = keysDown.ArrowUp ? 1 : 0;
      if (keysDown.ArrowDown) fwd -= 1;
      var steer = 0;
      if (keysDown.ArrowRight) steer -= 1;
      if (keysDown.ArrowLeft) steer += 1;
      var targetFwdSpeed = fwd * moveSpeed;
      vehicleVelFwd += (targetFwdSpeed - vehicleVelFwd) * Math.min(1, driveResponse * dt);
      var targetYawRate = steer * steerSpeed;
      vehicleYawRate += (targetYawRate - vehicleYawRate) * Math.min(1, steerResponse * dt);
      vehicleYaw += vehicleYawRate * dt;
      var fx = Math.cos(vehicleYaw);
      var fy = Math.sin(vehicleYaw);
      vehicleRoot.position.x += fx * vehicleVelFwd * dt;
      vehicleRoot.position.y += fy * vehicleVelFwd * dt;
      if (keysDown.KeyW) {
        vehicleRoot.position.z += wKeyClimbZ * dt;
      }
      if (keysDown.KeyS) {
        vehicleRoot.position.z -= sKeyDescendZ * dt;
      }
      if (fwd > 0 && Math.abs(chaseCamOrbitYaw) > 0.012) {
        chaseCamOrbitYaw += (0 - chaseCamOrbitYaw) * Math.min(1, dt * 2.0);
      }
      var margin = 3;
      vehicleRoot.position.x = Math.max(margin, Math.min(maxX - margin, vehicleRoot.position.x));
      vehicleRoot.position.y = Math.max(margin, Math.min(maxY - margin, vehicleRoot.position.y));
      vehicleRoot.updateMatrixWorld(true);
      var vBox = new THREE.Box3().setFromObject(vehicleRoot);
      var floorZ = groundSurfaceZ + zLift;
      if (vBox.min.z < floorZ) {
        vehicleRoot.position.z += floorZ - vBox.min.z;
      }
      vehicleMeshYaw += (vehicleYaw - vehicleMeshYaw) * Math.min(1, meshYawSmooth * dt);
      vehicleRoot.rotation.set(0, 0, vehicleMeshYaw);
      updateChaseCamera();
    }
    renderer.render(scene, camera);
  }
  vehicleMode = 'orbit';
  controls.enabled = true;
  controls.target.set(centerX, centerY, 0);
  camera.position.set(centerX + maxDim * 0.9, centerY + maxDim * 0.9, maxDim * 0.75);
  camera.up.set(0, 0, 1);
  camera.lookAt(centerX, centerY, 0);
  camera.fov = orbitViewFov;
  camera.updateProjectionMatrix();
  controls.update();
  hideVehicleHint();
  try {
    document.exitPointerLock();
  } catch (eOrbit0) { /* ignore */ }
  syncVehicleFabUi();
  tick();
  if (!useGroundTex) {
    scheduleHideLoadingAfterPaint();
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var hud = document.getElementById('hud');
  if (hud && payload.exportedAt) {
    hud.innerHTML += '<br/><span style="opacity:0.75">Coords: sceneX=layoutX, sceneY=' + maxY + '−layoutY · Exported: ' + payload.exportedAt + ' · sim t=' + (payload.simTimeSec != null ? payload.simTimeSec : '?') + 's' +
      (useGroundTex ? (' · <strong>Ground</strong>: JPEG tiles · slab 0.5m×Z' + (useTiles ? ' (4)' : '')) : '') + '</span>';
  }
  }

  window.addEventListener('message', function onGrid3dViewerInit(ev) {
    if (!ev.data || ev.data.kind !== 'grid3dViewerInit') return;
    if (window.opener && ev.source !== window.opener) return;
    if (grid3dPayloadWatchdog) {
      clearTimeout(grid3dPayloadWatchdog);
      grid3dPayloadWatchdog = null;
    }
    window.removeEventListener('message', onGrid3dViewerInit);
    setLoadingText('3D 데이터 수신 완료', '장면을 초기화하는 중입니다…');
    try {
      runViewer(ev.data.payload);
    } catch (ex) {
      console.error(ex);
      showErr('Failed to build 3D view: ' + (ex && ex.message ? ex.message : ex));
    }
  });
  var hudWait = document.getElementById('hud');
  if (hudWait) hudWait.innerHTML = 'Layout 3D — 준비 중 (아래 안내 참고)';
  grid3dPayloadWatchdog = setTimeout(function () {
    grid3dPayloadWatchdog = null;
    if (!window.__GRID3D_STARTED__) {
      showErr('Missing layout payload. Open this window from the designer 3D button.');
    }
  }, 120000);
})();
  </script>
</body>
</html>
